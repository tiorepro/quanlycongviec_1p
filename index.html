function rangeFor(r){const td=today();if(r==='week'){const w=(pd(td).getDay()+6)%7,a=addDays(td,-w);return [a,addDays(a,6)]}if(r==='quarter'){const d=pd(td),q=Math.floor(d.getMonth()/3);return [ymd(new Date(d.getFullYear(),q*3,1)),ymd(new Date(d.getFullYear(),q*3+3,0))]}return mRange(thisM())}
const isWorkDay=d=>{const w=pd(d).getDay();return w>0&&w<6};
const prevWork=d=>{let x=addDays(d,-1);while(!isWorkDay(x))x=addDays(x,-1);return x};
function streaks(empId){
  const days=new Set(S.tasks.filter(t=>t.assigneeId===empId&&t.status==='Hoàn thành'&&t.completedAt).map(t=>t.completedAt));
  const work=[...days].filter(isWorkDay).sort();
  let cur=0,d=today();if(!isWorkDay(d)||!days.has(d))d=isWorkDay(d)?prevWork(d):prevWork(d);
  while(days.has(d)){cur++;d=prevWork(d)}
  let best=0,run=0,prev=null;work.forEach(x=>{run=(prev&&prevWork(x)===prev)?run+1:1;if(run>best)best=run;prev=x});
  return {cur,best,active:days.size,days};
}
function doneIn(empId,a,b){return S.tasks.filter(t=>t.assigneeId===empId&&t.status==='Hoàn thành'&&t.completedAt&&t.completedAt>=a&&t.completedAt<=b)}
function heatmap(days,empId){
  const td=today(),w=(pd(td).getDay()+6)%7,start=addDays(td,-w-77),cnt={};
  S.tasks.forEach(t=>{if(t.assigneeId===empId&&t.status==='Hoàn thành'&&t.completedAt)cnt[t.completedAt]=(cnt[t.completedAt]||0)+1});
  let g='';for(let c=0;c<12;c++)for(let r=0;r<7;r++){const d=addDays(start,c*7+r);if(d>td)continue;const n=cnt[d]||0;const op=n===0?0:n===1?.3:n===2?.55:n<5?.8:1;
    g+=`<rect x="${34+c*18}" y="${r*18+2}" width="14" height="14" rx="3" fill="${n?'var(--primary)':'var(--gray-soft)'}" ${n?`opacity="${op}"`:''}><title>${fd(d)}: ${n} việc hoàn thành</title></rect>`}
  const lb=['T2','T4','T6','CN'].map((l,i)=>`<text x="0" y="${[0,2,4,6][i]*18+13}">${l}</text>`).join('');
  return `<svg class="svgc" style="max-width:440px" viewBox="0 0 ${34+12*18} 130" role="img" aria-label="Hoạt động 12 tuần">${lb}${g}</svg>`;
}

  const doneNow=doneIn(emp,a,b),onT=doneNow.filter(t=>timeliness(t)!=='Trễ hạn').length;
  const st=streaks(emp),pct=inR.length?Math.round(done.length/inR.length*100):0;
  const lbl={week:'Tuần này',month:'Tháng này',quarter:'Quý này'}[R];

function leaderboardCard(per){
  const [a,b]=per==='all'?['0000-01-01','9999-12-31']:mRange(per);
  const rows=S.emps.filter(e=>e.status==='Đang làm').map(e=>{const d=doneIn(e.id,a,b),on=d.filter(t=>timeliness(t)!=='Trễ hạn').length;return {e,n:d.length,pct:d.length?Math.round(on/d.length*100):null}}).filter(r=>r.n>0||S.tasks.some(t=>t.assigneeId===r.e.id&&t.due>=a&&t.due<=b)).sort((x,y)=>y.n-x.n||(y.pct||0)-(x.pct||0));
  const mx=Math.max(1,...rows.map(r=>r.n)),medal=['🥇','🥈','🥉'];
  return `<div class="card"><div class="card-h"><h3>Bảng xếp hạng đội nhóm</h3><small>${per==='all'?'Tất cả thời gian':fm(per)} · ${rows.length} thành viên</small></div>${rows.length?rows.slice(0,10).map((r,i)=>`<div class="li" style="margin-bottom:8px;padding:9px 12px"><span style="width:26px;text-align:center;font-weight:700">${medal[i]||(i+1)}</span>${av(r.e.id,'sm')}<div class="grow"><b>${esc(r.e.name)}</b><small>${esc(r.e.position)} · ${r.pct==null?'chưa có việc xong':r.pct+'% đúng hạn'}</small><div class="bar" style="margin-top:5px;height:5px"><i style="width:${r.n/mx*100}%"></i></div></div><b>${r.n}<small style="display:inline;font-weight:400"> task</small></b></div>`).join(''):emptyState('Chưa có dữ liệu')}</div>`;
}
function overloadCard(ts){
  const open=ts.filter(isOpen),by={};open.forEach(t=>{const k=t.group||'Khác';by[k]=(by[k]||0)+1});
  const cols=['#5b4bf0','#f59e0b','#10b981','#ef4444','#3b82f6','#a855f7','#14b8a6'];

document.addEventListener('click',e=>{
  const t=e.target;if(!t.closest)return;
  const pb=t.closest('[data-pop]');
  if(pb){UI.pop=UI.pop===pb.dataset.pop?null:pb.dataset.pop;const keepTop=pb.dataset.pop==='quick'||pb.dataset.pop==='export'||pb.dataset.pop==='notif';if(keepTop)renderTop();else render();return}
  const had=UI.pop;const inPop=t.closest('.pop');
  if(had&&(!inPop||!inPop.dataset.keep)){UI.pop=null}
  const a=t.closest('[data-act]');
  if(a&&!a.matches('select,input[type=checkbox]')){const f=ACT[a.dataset.act];if(f){f(a,e)}}
  if(had&&UI.pop===null&&!(a&&['go','goto','export','qk','page','fclearall'].includes(a.dataset.act)))render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-fk]')){const f=fget(t.dataset.k),k=t.dataset.d;f[k]=f[k]||[];const i=f[k].indexOf(t.value);if(t.checked&&i<0)f[k].push(t.value);if(!t.checked&&i>=0)f[k].splice(i,1);UI.page[t.dataset.k]=1;UI.sel.clear();return render()}
  if(t.matches('[data-fr]')){const f=fget(t.dataset.k);f.range=f.range||{};f.range[t.dataset.e]=t.value;UI.page[t.dataset.k]=1;return render()}
  const a=t.dataset&&t.dataset.act;
  if(a==='sub-toggle'){toggleSub(t.dataset.id,t.dataset.s,t.checked);return}
  if(a==='tgroup'){UI.tgroup=t.checked;UI.page.tasks=1;return render()}
  if(a==='cal-span'){UI.cal.span=t.checked;return render()}
  if(a==='mesel'){UI.meEmp=t.value;return render()}
  if(a==='dashf'){UI.dashF[t.dataset.k]=t.value;return render()}
  if(a==='rc-toggle'){const r=S.recurs.find(x=>x.id===t.dataset.id);if(r&&canRecur(r)){r.active=t.checked;if(r.active&&genRecurring())toast('Đã tạo công việc cho hôm nay');save();render()}return}
  if(a==='period'){S.meta.period=t.value;save();UI.page={};return render()}
  if(a==='tsort'){UI.tsort=t.value;return render()}
  if(a==='switchme'){S.meta.me=t.value;save();UI.sel.clear();UI.page={};toast(`Đang dùng với tư cách ${me().name} (${me().role})`);return render()}
  if(a==='selone'){t.checked?UI.sel.add(t.dataset.id):UI.sel.delete(t.dataset.id);return render()}
  if(a==='selall'){const ids=paginate('tasks',filteredTasks(),10).items.map(x=>x.id);ids.forEach(id=>t.checked?UI.sel.add(id):UI.sel.delete(id));return render()}
  if(a==='r-done'){return completeReminder(t.dataset.id,t.checked)}
  if(t.id==='fileIn'){const f=t.files[0];if(f&&UI.upT){if(f.size>25*1048576)toast('Tệp tối đa 25 MB','err');else addDoc(f,{taskId:UI.upT})}return}
  if(t.id==='impIn'){const f=t.files[0];if(f)importBackup(f)}
});

function importBackup(file){
  const r=new FileReader();
  r.onload=async()=>{
    try{const o=JSON.parse(r.result);if(!o||o.v!==1||!Array.isArray(o.emps)||!Array.isArray(o.tasks)||!Array.isArray(o.projects))throw new Error('format');
      if(!await confirmBox({title:'Khôi phục dữ liệu',msg:`Tệp chứa ${o.emps.length} nhân sự, ${o.projects.length} dự án, ${o.tasks.length} công việc. Dữ liệu hiện tại sẽ bị thay thế. Tiếp tục?`,ok:'Khôi phục',danger:true}))return;
      S=o;fix();applyTheme();UI.F={};UI.page={};UI.sel.clear();save(true);navigate('dashboard');toast('Đã khôi phục dữ liệu')}
    catch(e){toast('Tệp không đúng định dạng sao lưu của ứng dụng','err')}
  };
  r.onerror=()=>toast('Không đọc được tệp','err');r.readAsText(file);
}

}
