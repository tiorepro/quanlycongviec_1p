<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý công việc & KPI đội nhóm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3fa;--surface:#fff;--surface2:#f7f8fd;--line:#e4e6f1;--line2:#eef0f8;--text:#1d2040;--muted:#6a6f8f;--primary:#5b4bf0;--primary-d:#4636d6;--primary-soft:#eeecff;--ok:#16a34a;--ok-soft:#dcf5e5;--warn:#c2700a;--warn-soft:#fdf0d1;--bad:#d92d3a;--bad-soft:#fde4e6;--info:#2563eb;--info-soft:#e0eaff;--gray-soft:#eceef6;--shadow:0 1px 2px rgba(29,32,64,.05),0 8px 24px rgba(29,32,64,.06);--sbw:236px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--surface:#1b1e3a;--surface2:#212547;--line:#30345c;--line2:#272b50;--text:#eceefc;--muted:#9ea3c7;--primary:#8b7dff;--primary-d:#a99eff;--primary-soft:#2b2870;--ok:#4ade80;--ok-soft:#14382a;--warn:#f5b44c;--warn-soft:#3d2f10;--bad:#ff7a85;--bad-soft:#431c26;--info:#7aa7ff;--info-soft:#1b2f63;--gray-soft:#2a2e55;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12142a;--surface:#1b1e3a;--surface2:#212547;--line:#30345c;--line2:#272b50;--text:#eceefc;--muted:#9ea3c7;--primary:#8b7dff;--primary-d:#a99eff;--primary-soft:#2b2870;--ok:#4ade80;--ok-soft:#14382a;--warn:#f5b44c;--warn-soft:#3d2f10;--bad:#ff7a85;--bad-soft:#431c26;--info:#7aa7ff;--info-soft:#1b2f63;--gray-soft:#2a2e55;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
body{margin:0;height:100%;font:14px/1.45 Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600}
a{color:var(--primary)}
.ic{flex:none;vertical-align:middle}
.app{display:flex;height:100%;min-height:0}
/* sidebar */
.side{width:var(--sbw);flex:none;background:linear-gradient(185deg,#5a2fe6 0%,#3b3fd6 55%,#2a4ad4 100%);color:#fff;display:flex;flex-direction:column;transition:width .2s,transform .2s;position:relative;z-index:30}
.app.collapsed .side{width:68px}
.app.collapsed .side .lbl,.app.collapsed .side .brand-t,.app.collapsed .side .grp,.app.collapsed .side .me-info{display:none}
.app.collapsed .side .nav a{justify-content:center;padding:10px}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 10px}
.brand-i{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.brand-t b{display:block;font-size:15px;letter-spacing:.2px}
.brand-t span{font-size:10.5px;opacity:.8;line-height:1.2;display:block}
.collapse{position:absolute;right:-12px;top:22px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;padding:0;box-shadow:var(--shadow)}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:6px}
.grp{font-size:11px;font-weight:600;opacity:.7;padding:14px 8px 6px;letter-spacing:.4px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:#fff;text-decoration:none;font-size:13.5px;opacity:.92;margin-bottom:2px;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.12)}
.nav a.on{background:rgba(255,255,255,.2);opacity:1;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.nav .bdg{margin-left:auto;background:#3b82f6;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.me{padding:10px 12px 14px;border-top:1px solid rgba(255,255,255,.15);display:flex;gap:10px;align-items:center}
.me-info{min-width:0;flex:1}
.me-info small{display:block;opacity:.75;font-size:11px}
.me select{width:100%;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 6px;font-size:12px;margin-top:3px}
.me select option{color:#111}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.tb-ic{width:32px;height:32px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.tb-t{min-width:0;flex:1}.tb-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb-t span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.icon-btn.hamb{display:none}
.content{flex:1;overflow:auto;padding:22px 26px 40px;min-height:0}
.pg-t{font-size:24px;font-weight:600;margin-bottom:2px}
.pg-s{color:var(--muted);margin:0 0 18px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface2)}
.btn:focus-visible,.icon-btn:focus-visible,.nav a:focus-visible,.pill:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.btn-p{background:var(--primary);border-color:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-d);border-color:var(--primary-d)}
.btn-soft{background:var(--primary-soft);border-color:transparent;color:var(--primary)}.btn-soft:hover{background:var(--primary-soft);filter:brightness(.97)}
.btn-d{background:var(--bad);border-color:var(--bad);color:#fff}.btn-d:hover{background:var(--bad);filter:brightness(.92)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn-ok:hover{background:var(--ok);filter:brightness(.92)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;padding:0;color:var(--muted)}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.icon-btn.d{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.icon-btn.d:hover{border-color:var(--bad)}
.acts{display:inline-flex;gap:5px}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:15px}.card-h small{color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.5fr 1fr}.g2e{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.stat{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:left;width:100%}
button.stat:hover{border-color:var(--primary)}
.stat-i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.stat small{color:var(--muted);font-size:12px;display:block}.stat b{font-size:22px;line-height:1.2;display:block}.stat em{font-style:normal;font-size:11.5px;color:var(--muted)}
.c-blue{background:#3b82f6}.c-green{background:#10b981}.c-red{background:#ef4444}.c-orange{background:#f59e0b}.c-violet{background:#7c5cf0}.c-teal{background:#14b8a6}.c-gray{background:#64748b}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;width:fit-content;max-width:100%;overflow:auto}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 14px;font-weight:500;color:var(--muted);display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.tab.on{background:var(--primary);color:#fff}
.utabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.utab{border:0;background:transparent;padding:8px 2px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.utab.on{color:var(--primary);border-color:var(--primary)}
/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--gray-soft);color:var(--muted)}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-info{background:var(--info-soft);color:var(--info)}.t-pri{background:var(--primary-soft);color:var(--primary)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* progress */
.bar{height:7px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.bar.ok i{background:var(--ok)}.bar.bad i{background:var(--bad)}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:600;flex:none}
.av.sm{width:24px;height:24px;font-size:9.5px}.av.lg{width:48px;height:48px;font-size:16px}
.avs{display:inline-flex}.avs .av{margin-left:-7px;border:2px solid var(--surface)}.avs .av:first-child{margin-left:0}
.pp{display:inline-flex;align-items:center;gap:8px;min-width:0}.pp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* filters */
.fbar{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.search{position:relative;max-width:520px;width:100%}
.search input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px 9px 36px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.fpills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fl{color:var(--primary);font-weight:600;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;background:var(--primary-soft);padding:6px 10px;border-radius:99px}
.fp{position:relative}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;color:var(--text)}
.pill.act{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.pill b{background:var(--primary);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;font-weight:600}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,22,50,.22);padding:10px}
.pop.r{left:auto;right:0}
.pop-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:6px}
.pop-h button{border:0;background:var(--bad-soft);color:var(--bad);border-radius:6px;font-size:11px;padding:1px 7px}
.pop-l{max-height:230px;overflow:auto}
.pop-l label{display:flex;gap:9px;align-items:center;padding:6px 6px;border-radius:7px;cursor:pointer;font-size:13px}
.pop-l label:hover{background:var(--surface2)}
.pop .rng{display:grid;gap:8px}
.menu{display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;display:flex;gap:9px;align-items:center;font-size:13px}
.menu button:hover{background:var(--surface2)}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--surface2)}
.tbl .t1{font-weight:600;display:block;min-width:230px;max-width:380px;font-size:13px}.tbl small{color:var(--muted);display:block;font-size:11.5px}
.tbl tr.sel td{background:var(--primary-soft)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:12px}
.pager{display:flex;gap:5px;align-items:center}
.pager button{min-width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 8px}
.pager button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pager button[disabled]{opacity:.4}
.bulk{display:flex;gap:10px;align-items:center;background:var(--primary-soft);color:var(--primary);padding:8px 12px;border-radius:12px;margin-bottom:10px;flex-wrap:wrap;font-weight:500}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);margin:8px 0 4px;font-size:15px}
/* project cards */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.pc-h{display:flex;gap:12px;align-items:flex-start}
.pc-i{width:38px;height:38px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.pc-h h4{font-size:14.5px;line-height:1.3}.pc-h small{color:var(--muted);font-size:12px}
.pc-g{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:12.5px}
.pc-g small{display:block;color:var(--muted);font-size:11.5px}.pc-g b{font-weight:600}
.pc-f{display:flex;justify-content:space-between;align-items:center}
.mut{color:var(--muted)}
.sp{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
/* priority cards */
.prio{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pr{border-radius:16px;padding:12px 6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid transparent}
.pr b{font-size:12.5px}.pr span{font-size:22px;font-weight:700}
.ring{width:44px;height:44px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.legend div{display:flex;gap:8px;align-items:center}.legend b{margin-left:auto;padding-left:10px}
.chartrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.svgc{width:100%;height:auto;display:block}
.svgc text{fill:var(--muted);font-size:11px;font-family:inherit}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:14px;overflow:auto;padding-bottom:10px;align-items:start}
.kc{background:var(--surface2);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 330px);min-height:240px}
.kc-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:600;font-size:13px}
.kc-h .n{margin-left:auto;background:var(--gray-soft);border-radius:8px;font-size:11.5px;padding:0 8px;color:var(--muted)}
.kc-b{padding:0 10px 10px;overflow:auto;display:flex;flex-direction:column;gap:10px;flex:1}
.kc.over{outline:2px dashed var(--primary);outline-offset:-4px}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kcard.late{border-left-color:var(--bad)}.kcard.dragging{opacity:.45}
.kcard small{color:var(--muted);font-size:11px}.kcard h5{margin:0;font-size:13px;line-height:1.35;font-weight:600}
.kcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kcard .meta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
/* gantt */
.gt{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:flex}
.gt-l{width:280px;flex:none;border-right:1px solid var(--line);background:var(--surface)}
.gt-r{flex:1;overflow:auto;position:relative}
.gt-hd{height:52px;border-bottom:1px solid var(--line);background:var(--surface2);display:flex;align-items:flex-end;padding:0 12px 8px;font-weight:600;font-size:12px;color:var(--muted)}
.gt-row{height:38px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line2);gap:8px;font-size:12.5px;overflow:hidden}
.gt-row.pj{background:var(--surface2);font-weight:600}
.gt-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt-scale{position:relative;height:52px;border-bottom:1px solid var(--line);background:var(--surface2)}
.gt-scale div{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:4px 6px;white-space:nowrap}
.gt-scale div.d{top:26px;padding:4px 0 0;text-align:center;border-left:1px solid var(--line2)}
.gt-body{position:relative}
.gt-line{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--bad);z-index:3}
.gt-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2)}
.gt-bar{position:absolute;height:20px;border-radius:7px;background:var(--info-soft);border:1px solid var(--info);overflow:hidden;cursor:pointer;z-index:2;display:flex;align-items:center;font-size:11px;padding:0 6px;white-space:nowrap}
.gt-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--info);opacity:.45}
.gt-bar span{position:relative;color:var(--text)}
.gt-bar.pj{background:var(--primary-soft);border-color:var(--primary)}.gt-bar.pj i{background:var(--primary)}
.gt-bar.ok{background:var(--ok-soft);border-color:var(--ok)}.gt-bar.ok i{background:var(--ok)}
.gt-bar.bad{background:var(--bad-soft);border-color:var(--bad)}.gt-bar.bad i{background:var(--bad)}
.gt-bar.warn{background:var(--warn-soft);border-color:var(--warn)}.gt-bar.warn i{background:var(--warn)}
/* calendar */
.cal-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-h h3{font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.cal .dh{padding:9px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--line)}
.cal .dc{min-height:104px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dc:nth-child(7n){border-right:0}
.cal .dc.out{background:var(--surface2);color:var(--muted)}
.cal .dc.today .dn{background:var(--primary);color:#fff}
.dn{font-size:12px;font-weight:600;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;padding:0}
.chip{font-size:11px;border-radius:6px;padding:2px 6px;text-align:left;border:0;display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--info-soft);color:var(--info);line-height:1.3}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.rm{background:var(--primary-soft);color:var(--primary)}
.chip small{display:block;opacity:.75;font-size:10px}

function setStatus(t,ns,note){
  let msg='';
  if(ns==='Hoàn thành'&&!isMgr()){ns='Chờ xác nhận';msg='Công việc đã được gửi cho quản lý xác nhận.'}
  const old=t.status;if(old===ns)return msg;
  t.status=ns;t.updatedAt=Date.now();
  if(ns==='Hoàn thành'){t.progress=100;t.completedAt=t.submittedAt||today();t.submittedAt=''}
  else if(ns==='Chờ xác nhận'){t.progress=100;t.submittedAt=today();t.completedAt=''}
  else if(ns==='Chưa bắt đầu'){t.progress=0;t.completedAt='';t.submittedAt=''}
  else if(ns==='Đã huỷ'){t.completedAt='';t.submittedAt=''}
  else if(ns==='Đang chờ'){t.completedAt='';t.submittedAt='';if(t.progress>=100)t.progress=90}
  else{if(t.progress<=0)t.progress=10;if(t.progress>=100)t.progress=90;t.completedAt='';t.submittedAt=''}
  t.history.unshift({t:Date.now(),by:S.meta.me,text:`${old} → ${ns}${note?': '+note:''}`});
  logAct(`Công việc ${t.id}: ${old} → ${ns}`);
  return msg;
}

function rankOf(score){const rs=[...S.settings.ranks].sort((a,b)=>b.min-a.min);for(const r of rs)if(score>=r.min)return r.name;return rs.length?rs[rs.length-1].name:'—'}
const rankTag=r=>`<span class="tag ${{'Xuất sắc':'t-ok','Tốt':'t-ok','Khá':'t-info','Đạt':'t-warn','Chưa đạt':'t-bad'}[r]||''}">${esc(r)}</span>`;
function tplFor(emp){return S.tpls.find(t=>!t.isDefault&&(t.positions.includes(emp.position)||t.depts.includes(emp.dept)))||S.tpls.find(t=>t.isDefault)||S.tpls[0]}
function sysVal(src,empId,period){
  const [a,b]=mRange(period);
  const ts=S.tasks.filter(t=>t.assigneeId===empId&&t.due>=a&&t.due<=b&&t.status!=='Đã huỷ');
  if(src==='completion'){if(!ts.length)return null;return r1(ts.filter(t=>t.status==='Hoàn thành').length/ts.length*100)}
  if(src==='ontime'){const base=ts.filter(t=>t.status==='Hoàn thành'||t.due<today());if(!base.length)return null;return r1(base.filter(t=>t.status==='Hoàn thành'&&(t.completedAt||t.due)<=t.due).length/base.length*100)}
  return null;
}
const has=v=>v!==null&&v!==undefined&&v!=='';
function kpiCompute(rec){
  if(rec.snap)return rec.snap;
  const emp=gEmp(rec.empId)||{position:'',dept:''};
  const tpl=S.tpls.find(t=>t.id===rec.tplId)||tplFor(emp);
  const cap=S.settings.cap/100;let score=0;const rows=[];
  for(const c of (tpl?tpl.criteria:[])){
    const it=(rec.items||{})[c.id]||{};
    let sys=null,val=null,pending=false;
    if(c.source!=='manual'){sys=sysVal(c.source,rec.empId,rec.period);val=sys}
    else{val=has(it.actual)?+it.actual:(has(it.self)?+it.self:null);pending=!has(it.actual)}
    const tg=critTarget(c,rec.empId,rec.period);
    let ach=val==null?1:(c.dir==='down'?(val<=0?cap:tg/val):val/tg);
    ach=Math.max(0,Math.min(cap,ach));
    const sc=ach*c.weight;score+=sc;
    rows.push({c,target:tg,sys,self:has(it.self)?+it.self:null,actual:has(it.actual)?+it.actual:null,val,ach,score:r1(sc),pending,selfNote:it.selfNote||'',mgrNote:it.mgrNote||''});
  }
  score=r1(score);
  return {rows,score,rank:rankOf(score),tplName:tpl?tpl.name:''};
}

}

function hasKpiData(emp,period){const k=kpiOf(period,emp.id);if(k&&(k.status!=='Đang theo dõi'))return true;return S.tasks.some(t=>t.assigneeId===emp.id&&mk(t.due)===period)}
function avgKpi(period,filter){

function seedKpi(){

function recurMatch(r,date){const d=pd(date),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),md=Math.min(+r.monthDay||1,last);
  if(r.type==='monthly')return d.getDate()===md;
  if(r.type==='quarterly')return d.getMonth()%3===0&&d.getDate()===md;
  if(r.type==='yearly')return d.getMonth()+1===(+r.month||1)&&d.getDate()===md;
  return (r.days||[]).map(Number).includes(d.getDay())}
function recurOccurrences(r,from,to){const out=[];for(let d=from;d<=to;d=addDays(d,1)){if(r.startDate&&d<r.startDate)continue;if(r.endDate&&d>r.endDate)break;if(recurMatch(r,d))out.push(d)}return out}
function genRecurring(){

    let from=r.lastGen?addDays(r.lastGen,1):td;const floor=addDays(td,-7);if(from<floor)from=floor;
    recurOccurrences(r,from,td).forEach(d=>{
      if(S.tasks.some(t=>t.recurId===r.id&&t.due===d))return;
      const nid=netOn()?r.id+'-'+d.replace(/-/g,'').slice(2):nextCode('CV',S.tasks);

      S.tasks.push({id:nid,name:r.name,projectId:r.projectId||'',group:r.group||'',assigneeId:r.assigneeId,memberIds:(r.memberIds||[]).filter(x=>x!==r.assigneeId),assignerId:r.createdBy||r.assigneeId,approverId:a.managerId||'NS0001',start:d,startTime:r.startTime||'',due:d,dueTime:r.dueTime||'',priority:r.priority||'Bình thường',status:'Chưa bắt đầu',progress:0,desc:r.desc||'',result:'',note:'',completedAt:'',submittedAt:'',recurId:r.id,createdAt:Date.now(),updatedAt:Date.now(),history:[{t:Date.now(),by:r.createdBy||r.assigneeId,text:'Tạo tự động từ lịch lặp '+r.id}]});n++;

function paginate(key,arr,per){
  const pages=Math.max(1,Math.ceil(arr.length/per));const p=Math.min(Math.max(1,UI.page[key]||1),pages);UI.page[key]=p;
  const from=(p-1)*per;const items=arr.slice(from,from+per);
  const info=arr.length?`Hiển thị ${from+1}-${from+items.length} của ${arr.length} bản ghi`:'Không có bản ghi';
  let b='';
  if(pages>1){const ps=[];for(let i=1;i<=pages;i++)if(i===1||i===pages||Math.abs(i-p)<=1)ps.push(i);
    let last=0;b=`<div class="pager"><button data-act="page" data-k="${key}" data-p="${p-1}" ${p<=1?'disabled':''} aria-label="Trang trước">${ic('cl',14)}</button>`;
    ps.forEach(i=>{if(i-last>1)b+='<span>…</span>';b+=`<button class="${i===p?'on':''}" data-act="page" data-k="${key}" data-p="${i}">${i}</button>`;last=i});
    b+=`<button data-act="page" data-k="${key}" data-p="${p+1}" ${p>=pages?'disabled':''} aria-label="Trang sau">${ic('cr',14)}</button></div>`}
  return {items,info,html:`<div class="foot"><span>${info}</span>${b}</div>`};
}

function donut(data,o={}){
  const size=o.size||170,th=o.th||24,r=(size-th)/2,c=size/2,C=2*Math.PI*r,tot=sum(data.map(d=>d.value));let off=0;
  const segs=tot?data.filter(d=>d.value>0).map(d=>{const l=d.value/tot*C;const s=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${th}" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"><title>${esc(d.label)}: ${d.value}</title></circle>`;off+=l;return s}).join(''):`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--gray-soft)" stroke-width="${th}"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(o.label||'Biểu đồ tròn')}" style="flex:none">${segs}<text x="${c}" y="${c+(o.small?2:7)}" text-anchor="middle" style="font-size:${Math.round(size/(String(o.big!=null?o.big:tot).length>5?9:6.2))}px;font-weight:700;fill:var(--text)">${esc(o.big!=null?o.big:tot)}</text>${o.small?`<text x="${c}" y="${c+size/9+2}" text-anchor="middle" style="font-size:11px">${esc(o.small)}</text>`:''}</svg>`;
}
function ring(pct,col){const r=17,C=2*Math.PI*r,l=Math.max(0,Math.min(100,pct))/100*C;return `<svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--gray-soft)" stroke-width="5"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${l} ${C}" transform="rotate(-90 22 22)"/><text x="22" y="25.5" text-anchor="middle" style="font-size:10px;font-weight:600;fill:var(--text)">${Math.round(pct)}%</text></svg>`}
function sm(p){let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
function lineChart(pts,o={}){
  const W=560,H=250,L=40,Rr=18,T=18,B=32,max=o.max||120;
  const n=pts.length,x=i=>L+(n<2?(W-L-Rr)/2:i*(W-L-Rr)/(n-1)),y=v=>T+(H-T-B)*(1-Math.max(0,Math.min(max,v))/max);
  const grid=[0,20,40,60,80,100,120].filter(v=>v<=max).map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}${o.unit||''}</text>`).join('');
  const P2=pts.map((p,i)=>[x(i),y(p.value)]);
  const path=n>1?sm(P2):`M${P2[0][0]},${P2[0][1]}`;
  const area=n>1?`${path} L${P2[n-1][0]},${y(0)} L${P2[0][0]},${y(0)} Z`:'';
  const col=o.color||'var(--primary)';
  return `<svg class="svgc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Biểu đồ đường')}">${grid}<path d="${area}" fill="${col}" opacity=".13"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2.5"/>${P2.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--surface)" stroke="${col}" stroke-width="2.5"><title>${esc(pts[i].label)}: ${pts[i].value}${o.unit||''}</title></circle><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" style="fill:var(--text);font-weight:600;font-size:10.5px">${pts[i].value}${o.unit||''}</text><text x="${p[0]}" y="${H-10}" text-anchor="middle">${esc(pts[i].label)}</text>`).join('')}</svg>`;
}
function stackBars(rows,o={}){
  const pct=o.pct,W=Math.max(560,rows.length*72),H=250,L=o.fmt?60:36,Rr=10,T=14,B=44;
  const mx=pct?100:Math.max(1,...rows.map(r=>sum(r.segs.map(s=>s.value))));
  const bw=Math.min(46,((W-L-Rr)/Math.max(1,rows.length))*.6),step=(W-L-Rr)/Math.max(1,rows.length);
  const y=v=>T+(H-T-B)*(1-v/mx);
  const ticks=pct?[0,25,50,75,100]:[0,1,2,3,4].map(i=>Math.round(mx*i/4));
  let g=ticks.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${o.fmt?o.fmt(v):v}${pct?'%':''}</text>`).join('');
  rows.forEach((r,i)=>{
    const tot=sum(r.segs.map(s=>s.value));let acc=0;const cx=L+step*i+step/2;
    if(!tot)g+=`<rect x="${cx-bw/2}" y="${y(0)-2}" width="${bw}" height="2" fill="var(--gray-soft)"/>`;
    r.segs.forEach(s=>{if(!s.value)return;const v=pct?s.value/tot*100:s.value;const y1=y(acc+v),y0=y(acc);acc+=v;g+=`<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1)}" fill="${s.color}"><title>${esc(r.label)} · ${esc(s.label)}: ${s.value}</title></rect>`});
    const lb=r.label.length>12?r.label.slice(0,11)+'…':r.label;
    g+=`<text x="${cx}" y="${H-24}" text-anchor="middle" transform="rotate(-22 ${cx} ${H-24})" style="text-anchor:end" ${''}>${esc(lb)}</text>`;
  });
  return `<div style="overflow-x:auto"><svg class="svgc" style="min-width:${Math.min(W,520)}px" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Biểu đồ cột')}">${g}</svg></div>`;
}

function dashKpi(){
  const kp=kpiPeriod();ensureKpi(kp);
  const recs=S.kpis.filter(k=>k.period===kp&&canSeeKpi(k.empId)&&(gEmp(k.empId)||{}).status==='Đang làm');
  const cs=recs.map(k=>({k,e:gEmp(k.empId),c:kpiCompute(k)}));
  const data=cs.filter(x=>hasKpiData(x.e,kp));
  const ak=data.length?r1(avg(data.map(x=>x.c.score))):null;
  const closed=recs.filter(k=>k.status==='Đã chốt').length;
  const okn=data.filter(x=>x.c.score>=50).length;
  const rk=S.settings.ranks.map((r,i)=>({label:r.name,value:data.filter(x=>x.c.rank===r.name).length,color:['#16a34a','#22c55e','#3b82f6','#f59e0b','#ef4444'][i%5]}));
  const byDept=S.cats.depts.map(d=>({d,v:avgKpi(kp,e=>e.dept===d&&canSeeKpi(e.id))})).filter(x=>x.v!=null);
  const sorted=[...data].sort((a,b)=>b.c.score-a.c.score);
  const critAvg={};data.forEach(x=>x.c.rows.forEach(r=>{(critAvg[r.c.name]=critAvg[r.c.name]||[]).push(r.ach*100)}));
  const li=x=>`<div class="li">${av(x.e.id)}<div class="grow"><b>${esc(x.e.name)}</b><small>${esc(x.e.dept)}</small></div><b>${fnum(x.c.score)}</b>${rankTag(x.c.rank)}</div>`;
  return `<h2 class="pg-t">Báo cáo KPI</h2><p class="pg-s">Tổng hợp điểm KPI, xếp loại và mức hoàn thành chỉ tiêu — ${fm(kp)}</p>
  <div class="stats">${statBox('target','c-violet','KPI trung bình',ak==null?'—':fnum(ak),'Trần điểm '+S.settings.cap)}${statBox('users','c-blue','Nhân sự có dữ liệu',data.length,`${recs.length} hồ sơ KPI`)}${statBox('check','c-green','Từ mức Đạt trở lên',data.length?Math.round(okn/data.length*100)+'%':'—',okn+' nhân sự')}${statBox('lock','c-gray','Đã chốt',recs.length?Math.round(closed/recs.length*100)+'%':'—',closed+'/'+recs.length+' hồ sơ')}</div>
  <div class="grid g2e" style="margin-bottom:16px"><div class="card"><div class="card-h"><h3>Phân bố xếp loại</h3></div><div class="chartrow">${donut(rk,{big:data.length,small:'nhân sự',size:160})}${legend(rk,true)}</div></div>
  <div class="card"><div class="card-h"><h3>KPI trung bình theo phòng ban</h3></div>${byDept.length?byDept.map(x=>hbar(x.d,x.v,S.settings.cap,x.v>=90?'var(--ok)':x.v>=50?'var(--primary)':'var(--bad)',fnum(x.v))).join(''):emptyState('Chưa có dữ liệu')}</div></div>
  <div class="grid g3" style="grid-template-columns:1fr 1fr 1fr">
   <div class="card"><div class="card-h"><h3>Điểm cao nhất</h3></div><div class="list">${sorted.slice(0,5).map(li).join('')||emptyState('Chưa có dữ liệu')}</div></div>
   <div class="card"><div class="card-h"><h3>Cần hỗ trợ thêm</h3></div><div class="list">${[...sorted].reverse().slice(0,5).map(li).join('')||emptyState('Chưa có dữ liệu')}</div></div>
   <div class="card"><div class="card-h"><h3>Mức đạt theo chỉ tiêu</h3></div>${Object.keys(critAvg).map(k=>hbar(k,avg(critAvg[k]),120,'var(--primary)',Math.round(avg(critAvg[k]))+'%')).join('')||emptyState('Chưa có dữ liệu')}</div>
  </div>`;
}

  const h=modal({title:'Cập nhật trạng thái',sub:t.id+' · '+t.name,size:'sm',dismiss:false,body:`<div class="frm" style="grid-template-columns:1fr">${fld({n:'status',l:'Trạng thái',t:'select',v:t.status,opts:ST})}${fld({n:'progress',l:'Tiến độ (%)',t:'number',min:0,max:100,v:t.progress})}${fld({n:'note',l:'Ghi chú cập nhật',t:'textarea'})}</div>`,foot:`<button class="btn" data-act="mclose">Hủy</button><button class="btn btn-p" data-act="save">Cập nhật</button>`});
  h.onsave=()=>{const d=readForm(h.box);if(d.progress!=null&&(d.progress<0||d.progress>100))return showErrs(h.box,{progress:'Tiến độ từ 0 đến 100'});
    let msg='';if(d.status!==t.status)msg=setStatus(t,d.status,d.note);
    if(d.progress!=null&&t.status!=='Hoàn thành'&&t.status!=='Chờ xác nhận'&&d.progress!==t.progress&&d.status===t.status){t.progress=d.progress;if(d.progress>0&&t.status==='Chưa bắt đầu')t.status='Đang thực hiện'}
    if(d.note&&d.status===t.status)t.history.unshift({t:Date.now(),by:S.meta.me,text:'Cập nhật: '+d.note});
    t.updatedAt=Date.now();save();h.close();render();refreshTaskModals();toast(msg||'Đã cập nhật công việc')};
}
async function bulkAct(v){
  const ids=[...UI.sel];
  if(v==='clear'){UI.sel.clear();return render()}
  if(v==='del'){if(!await confirmBox({title:'Xóa công việc',msg:`Xóa ${ids.length} công việc đã chọn?`,ok:'Xóa',danger:true,}))return;
    S.tasks=S.tasks.filter(t=>!ids.includes(t.id));S.reminders=S.reminders.filter(r=>!ids.includes(r.taskId));UI.sel.clear();logAct(`Xóa ${ids.length} công việc`);save();render();return toast('Đã xóa công việc')}
  if(v==='archive'||v==='unarchive'){const ts=ids.map(gTask).filter(Boolean),arch=v==='archive';const ok=ts.filter(t=>arch?(t.status==='Hoàn thành'||t.status==='Đã huỷ'):t.archived);ok.forEach(t=>{t.archived=arch});UI.sel.clear();logAct(`${arch?'Lưu trữ':'Khôi phục'} ${ok.length} công việc`);save();render();return toast(ok.length?`Đã ${arch?'lưu trữ':'khôi phục'} ${ok.length} công việc`+(ts.length>ok.length?` (bỏ qua ${ts.length-ok.length} việc chưa xong)`:''):'Chỉ lưu trữ được công việc đã hoàn thành hoặc đã huỷ','ok')}
  if(v==='assign')return openAssign(ids);
  if(v==='status'){const h=modal({title:'Đổi trạng thái hàng loạt',sub:ids.length+' công việc',size:'sm',dismiss:false,body:`<div class="frm" style="grid-template-columns:1fr">${fld({n:'status',l:'Trạng thái mới',t:'select',v:'Đang thực hiện',opts:ST})}</div>`,foot:`<button class="btn" data-act="mclose">Hủy</button><button class="btn btn-p" data-act="save">Áp dụng</button>`});
    h.onsave=()=>{const d=readForm(h.box);ids.map(gTask).filter(t=>t&&canEditTask(t)).forEach(t=>setStatus(t,d.status));UI.sel.clear();save();h.close();render();toast('Đã cập nhật trạng thái')}}
}

  h.set({title:'Hồ sơ công việc',sub:'Thông tin, người tham gia, tài liệu và trạng thái xác nhận.',body,foot});

function taskAction(kind,id){
  const t=gTask(id);if(!t)return;
  if(kind==='start'){setStatus(t,'Đang thực hiện');toast('Đã bắt đầu thực hiện')}
  if(kind==='submit'){const m=setStatus(t,'Hoàn thành');toast(m||'Đã đánh dấu hoàn thành')}
  if(kind==='approve'){setStatus(t,'Hoàn thành','Quản lý xác nhận');toast('Đã xác nhận hoàn thành')}
  if(kind==='reopen'){setStatus(t,'Đang thực hiện','Mở lại công việc');toast('Đã mở lại công việc')}
  if(kind==='hold'||kind==='cancel'){const hold=kind==='hold';askReason({title:hold?'Tạm chờ công việc':'Huỷ công việc',sub:t.id+' · '+t.name,label:hold?'Lý do chờ (đang chờ ai / điều kiện gì)':'Lý do huỷ',ok:hold?'Chuyển sang Đang chờ':'Huỷ công việc',danger:!hold,req:!hold},note=>{setStatus(t,hold?'Đang chờ':'Đã huỷ',note);save();render();refreshTaskModals();toast(hold?'Đã chuyển sang Đang chờ':'Đã huỷ công việc')});return}
  if(kind==='resume'){setStatus(t,'Đang thực hiện','Tiếp tục thực hiện');toast('Đã tiếp tục thực hiện')}
  if(kind==='restore'){setStatus(t,'Chưa bắt đầu','Khôi phục công việc đã huỷ');toast('Đã khôi phục công việc')}
  if(kind==='arch'){t.archived=true;t.history.unshift({t:Date.now(),by:S.meta.me,text:'Lưu trữ công việc'});toast('Đã lưu trữ công việc')}
  if(kind==='unarch'){t.archived=false;t.history.unshift({t:Date.now(),by:S.meta.me,text:'Bỏ lưu trữ'});toast('Đã khôi phục từ lưu trữ')}
  if(kind==='reject'){const h=modal({title:'Trả lại công việc',sub:t.id,size:'sm',dismiss:false,body:`<div class="frm" style="grid-template-columns:1fr">${fld({n:'note',l:'Lý do trả lại',t:'textarea',req:1})}</div>`,foot:`<button class="btn" data-act="mclose">Hủy</button><button class="btn btn-d" data-act="save">Trả lại</button>`});
    h.onsave=()=>{const d=readForm(h.box);if(!showErrs(h.box,d.note?{}:{note:'Nhập lý do trả lại'}))return;setStatus(t,'Đang thực hiện',d.note);t.progress=90;save();h.close();render();refreshTaskModals();toast('Đã trả lại cho người phụ trách')};return}
  save();render();refreshTaskModals();
}
/* ========== Kanban / Gantt / Lịch / Nhắc việc ========== */
const AFTER={};
function commonTaskFilters(key){

const matchCommon=(f,t)=>fsel(f,'project',t.projectId)&&fsel(f,'assignee',t.assigneeId)&&fsel(f,'prio',t.priority)&&fsel(f,'due',dueState(t))&&fq(f,t.id,t.name,pName(t.projectId),eName(t.assigneeId));

   <div class="top"><small>${esc(pName(t.projectId))}</small>${prTag(t.priority)}</div><h5>${flagsHtml(t)}${esc(t.name)}</h5><small>${t.id} · ${esc(t.group)} ${subBadge(t)} ${linkBadge(t)}</small>
   <div class="sp"><div class="bar ${t.progress>=100?'ok':''}" style="flex:1"><i style="width:${t.progress}%"></i></div><span>${t.progress}%</span></div>
   <div class="meta">${av(t.assigneeId,'sm')}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(eName(t.assigneeId))}</span><span style="${isOverdue(t)?'color:var(--bad);font-weight:600':''}">${fdt2(t.due,t.dueTime)}</span>${tbtn('t-view','eye','Xem hồ sơ',t.id)}${tbtn('t-move','swap','Chuyển trạng thái',t.id)}${tbtn('remind','bell','Tạo nhắc việc',t.id)}</div></div>`;
  return `<div class="card-h" style="align-items:flex-start"><div><h2 class="pg-t">Kanban</h2><p class="pg-s" style="margin:0">Theo dõi công việc theo trạng thái, tiến độ và hạn xử lý trên một bảng trực quan. Kéo thả thẻ để đổi trạng thái.</p></div><button class="btn btn-p" data-act="t-new">${ic('plus',16)}Thêm công việc</button></div>`
  +filterBar('kanban',defs,{ph:'Tìm công việc, dự án hoặc người phụ trách...'})
  +`<div class="stats">${statBox('tasks','c-blue','Công việc',l.filter(t=>t.status!=='Đã huỷ').length)}${statBox('clock','c-red','Quá hạn',l.filter(isOverdue).length)}${statBox('send','c-orange','Chờ xác nhận',l.filter(t=>t.status==='Chờ xác nhận').length)}${statBox('check','c-green','Hoàn thành',l.filter(t=>t.status==='Hoàn thành').length)}</div>`

function kanbanDrop(id,status){
  const t=gTask(id);if(!t||t.status===status)return;
  if(!canEditTask(t))return toast('Bạn không có quyền đổi trạng thái công việc này','err');
  const m=setStatus(t,status);save();render();toast(m||`Đã chuyển ${t.id} sang "${t.status}"`);
}

/* ---------- Gantt ---------- */
VIEWS.gantt=()=>{
  const {f,defs}=commonTaskFilters('gantt');
  const dw={week:34,month:14,quarter:6}[UI.gz];
  const ts=S.tasks.filter(t=>!t.archived&&t.status!=='Đã huỷ'&&matchCommon(f,t)&&t.start&&t.due);
  const groups=S.projects.map(p=>({p,ts:ts.filter(t=>t.projectId===p.id).sort((a,b)=>a.start<b.start?-1:1)})).filter(g=>g.ts.length);
  const loose=ts.filter(t=>!gPrj(t.projectId));if(loose.length)groups.push({p:null,ts:loose});
  const head=`<div class="card-h" style="align-items:flex-start;flex-wrap:wrap"><div><h2 class="pg-t">Gantt</h2><p class="pg-s" style="margin:0">Tiến độ dự án và công việc theo dòng thời gian</p></div><div class="acts"><span class="tabs" style="margin:0;padding:4px">${[['week','Tuần'],['month','Tháng'],['quarter','Quý']].map(([k,l])=>`<button class="tab ${UI.gz===k?'on':''}" style="padding:5px 12px" data-act="gz" data-v="${k}">${l}</button>`).join('')}</span><button class="btn" data-act="gtoday">Hôm nay</button></div></div>`+filterBar('gantt',defs,{ph:'Tìm công việc, dự án hoặc người phụ trách...'});
  if(!groups.length)return head+`<div class="card">${emptyState('Không có công việc để hiển thị','Thêm công việc có ngày bắt đầu và hạn để xem trên Gantt.')}</div>`;
  const all=[...ts.map(t=>t.start),...ts.map(t=>t.due),today()];
  const min=addDays(all.sort()[0],-7),max=addDays(all.sort().pop(),14),n=diff(max,min)+1,W=n*dw;
  const x=d=>diff(d,min)*dw;
  let sc='',grid='';const mths=[];
  for(let i=0;i<n;i++){const d=addDays(min,i),dt=pd(d);
    if(dt.getDate()===1||i===0){mths.push({d,x:i*dw})}
    if(dt.getDay()===1){grid+=`<div class="gt-grid" style="left:${i*dw}px"></div>`;if(UI.gz!=='quarter')sc+=`<div class="d" style="left:${i*dw}px;width:${dw*(UI.gz==='week'?1:7)}px">${dt.getDate()}</div>`}
    if(UI.gz==='week'&&dt.getDay()!==1)sc+=`<div class="d" style="left:${i*dw}px;width:${dw}px">${dt.getDate()}</div>`;
  }
  sc=mths.map((m,i)=>`<div style="left:${m.x}px;width:${((mths[i+1]?mths[i+1].x:W)-m.x)}px;overflow:hidden">${m.d.slice(5,7)}/${m.d.slice(0,4)}</div>`).join('')+sc;
  let left='',rows='';let r=0;
  const cls=t=>t.status==='Hoàn thành'?'ok':isOverdue(t)?'bad':t.status==='Chờ xác nhận'?'warn':'';
  groups.forEach(g=>{
    if(g.p){const prog=pjProgress(g.p);left+=`<div class="gt-row pj">${ic('folder',15)}<span title="${esc(g.p.name)}">${esc(g.p.name)}</span></div>`;
      const s=g.ts.map(t=>t.start).sort()[0],e=g.ts.map(t=>t.due).sort().pop();

/* ---------- Lịch ---------- */
function calItems(f){
  const ts=S.tasks.filter(t=>!t.archived&&matchCommon(f,t)&&fsel(f,'status',t.status));
  const byDate={};ts.forEach(t=>{(byDate[t.due]=byDate[t.due]||[]).push({k:'t',t});if(UI.cal.span&&t.start&&t.start<t.due&&diff(t.due,t.start)<=31){for(let d=t.start;d<t.due;d=addDays(d,1))(byDate[d]=byDate[d]||[]).push({k:'t',t,span:true})}});
  S.reminders.filter(r=>r.by===S.meta.me&&!r.done).forEach(r=>{(byDate[r.date]=byDate[r.date]||[]).push({k:'r',r})});
  const from=addDays(today(),1),to=addDays(today(),180);
  (S.recurs||[]).filter(r=>r.active&&fsel(f,'project',r.projectId||'')&&fsel(f,'assignee',r.assigneeId)&&fsel(f,'prio',r.priority)&&fq(f,r.name,eName(r.assigneeId))&&(!f.status||!f.status.length||f.status.includes('Chưa bắt đầu'))).forEach(r=>recurOccurrences(r,from,to).forEach(d=>{(byDate[d]=byDate[d]||[]).push({k:'g',r})}));
  return {ts,byDate};
}
VIEWS.calendar=()=>{
  const {f,defs}=commonTaskFilters('calendar');defs.splice(2,0,{k:'status',l:'Trạng thái',opts:ST.map(x=>[x,x])});
  const {ts,byDate}=calItems(f);const c=UI.cal,d=pd(c.date);
  let title,from,to;
  if(c.mode==='month'){title=`Tháng ${pad(d.getMonth()+1)}/${d.getFullYear()}`;from=ymd(new Date(d.getFullYear(),d.getMonth(),1));to=ymd(new Date(d.getFullYear(),d.getMonth()+1,0))}
  else if(c.mode==='week'){from=addDays(c.date,-d.getDay());to=addDays(from,6);title=`${fd(from).slice(0,5)} – ${fd(to)}`}
  else{from=to=c.date;title=`${wd[d.getDay()]}, ${fd(c.date)}`}
  const inR=ts.filter(t=>t.due>=from&&t.due<=to);
  const chip=it=>it.k==='g'?`<button class="chip ghost" data-act="rc-edit" data-id="${it.r.id}" title="Dự kiến - tạo tự động từ lịch lặp">↻ ${esc(it.r.name)}<small>Dự kiến · ${esc(eName(it.r.assigneeId))}</small></button>`:it.k==='t'?`<button class="chip ${it.span?'span ':''}${isOverdue(it.t)?'bad':it.t.status==='Hoàn thành'?'ok':it.t.status==='Chờ xác nhận'?'warn':''}" data-act="t-view" data-id="${it.t.id}" title="${esc(it.t.name)}">${esc(it.t.name)}<small>${esc(eName(it.t.assigneeId))}</small></button>`:`<button class="chip rm" data-act="r-edit" data-id="${it.r.id}" title="${esc(it.r.title)}">${ic('bell',10)} ${esc(it.r.time)} ${esc(it.r.title)}</button>`;
  let grid='';
  if(c.mode==='month'){
    const first=pd(from),start=addDays(from,-first.getDay()),weeks=Math.ceil((first.getDay()+diff(to,from)+1)/7);
    grid=`<div class="cal">${wd.map(x=>`<div class="dh">${x}</div>`).join('')}${Array.from({length:weeks*7},(_,i)=>{const dd=addDays(start,i),its=byDate[dd]||[],out=dd<from||dd>to;
      return `<div class="dc ${out?'out':''} ${dd===today()?'today':''}"><button class="dn" data-act="cal-day" data-d="${dd}" aria-label="Xem ngày ${fd(dd)}">${pd(dd).getDate()}</button>${its.slice(0,3).map(chip).join('')}${its.length>3?`<button class="chip" style="background:transparent;color:var(--primary)" data-act="cal-day" data-d="${dd}">+${its.length-3} khác</button>`:''}</div>`}).join('')}</div>`}
  else if(c.mode==='week'){grid=`<div class="wk">${Array.from({length:7},(_,i)=>{const dd=addDays(from,i);return `<div class="col ${dd===today()?'today':''}"><h5>${wd[i]} · ${fd(dd).slice(0,5)}</h5>${(byDate[dd]||[]).map(chip).join('')||'<span class="mut" style="font-size:12px">Trống</span>'}</div>`}).join('')}</div>`}
  else{const its=byDate[from]||[];grid=`<div class="card"><div class="card-h"><h3>${wd[d.getDay()]}, ${fd(from)}</h3><button class="btn btn-sm btn-soft" data-act="t-new" data-due="${from}">${ic('plus',14)}Thêm công việc</button></div><div class="list">${its.map(it=>it.k==='g'?`<div class="li" style="border-style:dashed">${av(it.r.assigneeId)}<div class="grow"><b>↻ ${esc(it.r.name)}</b><small>Dự kiến · ${esc(eName(it.r.assigneeId))}${it.r.dueTime?' · hạn '+it.r.dueTime:''}</small></div>${tbtn('rc-edit','edit','Sửa lịch lặp',it.r.id)}</div>`:it.k==='t'?`<div class="li">${av(it.t.assigneeId)}<div class="grow"><b>${esc(it.t.name)}</b><small>${it.t.id} · ${esc(eName(it.t.assigneeId))}</small></div>${stTag(it.t)}${tbtn('t-view','eye','Xem',it.t.id)}</div>`:`<div class="li">${ic('bell',20)}<div class="grow"><b>${esc(it.r.title)}</b><small>Nhắc việc lúc ${esc(it.r.time)}</small></div>${tbtn('r-edit','edit','Sửa',it.r.id)}</div>`).join('')||emptyState('Không có công việc trong ngày này')}</div></div>`}
  return `<div class="card-h" style="align-items:flex-start"><div><h2 class="pg-t">Lịch công việc</h2><p class="pg-s" style="margin:0">Theo dõi deadline theo ngày, tuần hoặc tháng với bộ lọc riêng cho lịch.</p></div><button class="btn btn-p" data-act="t-new">${ic('plus',16)}Thêm công việc</button></div>
  <div class="cal-h"><button class="icon-btn" data-act="cal-nav" data-v="-1" aria-label="Trước">${ic('cl',16)}</button><button class="btn btn-sm" data-act="cal-today">Hôm nay</button><button class="icon-btn" data-act="cal-nav" data-v="1" aria-label="Sau">${ic('cr',16)}</button><h3>${title}</h3><label style="margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12.5px"><input type="checkbox" data-act="cal-span" ${UI.cal.span?'checked':''}>Hiện theo khoảng ngày</label><span class="tabs" style="margin:0;padding:4px">${[['month','Tháng'],['week','Tuần'],['day','Ngày']].map(([k,l])=>`<button class="tab ${c.mode===k?'on':''}" style="padding:5px 12px" data-act="cal-mode" data-v="${k}">${l}</button>`).join('')}</span></div>`
  +filterBar('calendar',defs,{ph:'Tìm công việc trên lịch...'})
  +`<div class="stats">${statBox('tasks','c-blue','Tổng công việc',inR.length,'Theo bộ lọc')}${statBox('clock','c-red','Quá hạn',inR.filter(isOverdue).length,'Cần ưu tiên')}${statBox('send','c-orange','Chờ xác nhận',inR.filter(t=>t.status==='Chờ xác nhận').length,'Quản lý kiểm tra')}</div>`+grid;
};

function checkReminders(){

  modal({title:'Hồ sơ KPI',sub:`${k.id} · Trần điểm ${S.settings.cap}%`,size:'lg',body:`<div class="hero">${av(e.id,'lg')}<div style="flex:1"><h4>${esc(e.name)}</h4><small>Kỳ ${k.period.slice(5)}/${k.period.slice(0,4)} · ${esc(e.dept)} · ${esc(e.position)}</small><div style="margin-top:6px">${kstTag(k.status)}</div></div></div>
  <div class="mini"><div><small>${fin?'Điểm được duyệt':'Điểm tạm tính'}</small><b>${fnum(c.score)}/${S.settings.cap}</b></div><div><small>Xếp loại</small><b>${fin?esc(c.rank):'<span style="font-size:14px;color:var(--muted)">Chưa tính chính thức</span>'}</b></div><div><small>Mẫu áp dụng</small><b style="font-size:14px">${esc(c.tplName)}</b></div></div>
  ${kpiTableHtml(c,k)}<div class="grid g2e" style="margin-top:12px"><div class="kv"><h5>Nhận xét nhân viên</h5><dd style="margin:0">${esc(k.empComment||'Chưa có nhận xét.')}</dd></div><div class="kv"><h5>Nhận xét quản lý</h5><dd style="margin:0">${esc(k.mgrComment||'Chưa có nhận xét.')}</dd></div></div>`,
  foot:`${k.status!=='Đã chốt'&&(canApproveKpi(k.empId)||k.empId===S.meta.me)?`<button class="btn" data-act="k-rev" data-id="${k.id}">${ic('clip',14)}${canApproveKpi(k.empId)?'Duyệt KPI':'Tự đánh giá'}</button>`:''}<button class="btn btn-p" data-act="mclose">Đóng</button>`});
}

/* ---------- Duyệt / tự đánh giá KPI ---------- */
function openKpiReview(id){
  const k=S.kpis.find(x=>x.id===id);if(!k||!canSeeKpi(k.empId))return;
  const e=gEmp(k.empId),locked=k.status==='Đã chốt';
  const empEdit=!locked&&k.empId===S.meta.me&&k.status==='Đang theo dõi';
  const mgrEdit=!locked&&canApproveKpi(k.empId);
  const c=kpiCompute(k);const auto=c.rows.filter(r=>r.c.source!=='manual').length,man=c.rows.length-auto;
  const crit=(r,i)=>{const cid=r.c.id,it=k.items[cid]||{},m=r.c.source==='manual';
    const tag=!m?'<span class="tag t-info">Tự động</span>':(has(it.actual)?'<span class="tag t-ok">Đã duyệt</span>':'<span class="tag t-warn">Chờ duyệt</span>');
    return `<div class="crit"><div class="crit-h"><span class="no">${pad(i+1)}</span><div style="flex:1"><b>${esc(r.c.name)}</b><small>${esc(r.c.desc||'')}</small></div>${tag}</div>
    <div class="crit-g"><div><small>Mục tiêu</small><b>${fnum(tgt(r))} ${unitTxt(r.c.unit)}</b></div><div><small>Hệ thống</small><b>${m?'N/A':fnum(r.sys)+(r.sys!=null?' '+unitTxt(r.c.unit):'')}</b></div><div><small>Nhân viên</small><b>${m?fnum(r.self):'N/A'}</b></div><div><small>Trọng số</small><b>${r.c.weight}%</b></div></div>
    ${!m?`<div class="note">${ic('check',15)}<span><b>Dữ liệu hệ thống.</b> Chỉ tiêu này được tự động lấy từ công việc và sẽ khóa theo dữ liệu hiện tại khi chốt KPI.</span></div>`
    :`<div class="frm">${fld({n:'self_'+cid,l:'Tự đánh giá của nhân viên',t:'number',min:0,max:150,step:'0.1',v:it.self,dis:!empEdit,ph:'Nhập giá trị'})}${fld({n:'actual_'+cid,l:'Thực tế được duyệt',t:'number',min:0,max:150,step:'0.1',v:it.actual,dis:!mgrEdit,ph:mgrEdit?'Nhập giá trị':'Chờ quản lý'})}${fld({n:'selfNote_'+cid,l:'Giải trình của nhân viên',t:'textarea',v:it.selfNote,dis:!empEdit,ph:'Nhập giải trình...'})}${fld({n:'mgrNote_'+cid,l:'Nhận xét quản lý',t:'textarea',v:it.mgrNote,dis:!mgrEdit,ph:mgrEdit?'Ghi nhận xét nếu cần...':''})}</div>`}</div>`};
  const body=`<div class="hero">${av(e.id,'lg')}<div style="flex:1;min-width:0"><h4>${esc(e.name)} ${kstTag(k.status)}</h4><small>Kỳ ${k.period.slice(5)}/${k.period.slice(0,4)} · ${esc(e.dept)}</small><div class="sw" style="margin-top:6px"><span class="tag">${auto} chỉ tiêu tự động</span><span class="tag">${man} chỉ tiêu cần duyệt</span><span class="tag">Trần điểm ${S.settings.cap}%</span></div></div><div style="text-align:right"><small class="mut">Điểm tạm tính</small><div style="font-size:26px;font-weight:700" id="kscore">${fnum(c.score)}</div><span id="krank" class="tag">${esc(c.rank)}</span></div></div>
   ${fld({n:'empComment',l:'Nhận xét tự đánh giá của nhân viên',t:'textarea',v:k.empComment,dis:!empEdit,full:1,ph:'Nhân viên nhập nhận xét tổng hợp...'})}<div style="height:10px"></div>
   ${c.rows.map(crit).join('')}
   ${fld({n:'mgrComment',l:'Nhận xét chung của quản lý',t:'textarea',v:k.mgrComment,dis:!mgrEdit,full:1,ph:mgrEdit?'Nhận xét tổng hợp / lý do trả lại...':''})}
   ${locked?`<div class="note g" style="margin-top:10px">${ic('lock',15)}<span>Hồ sơ đã chốt ngày ${fdt(k.lockedAt)}. Không thể chỉnh sửa.</span></div>`:''}`;
  const foot=locked?`<button class="btn btn-p" data-act="mclose">Đóng</button>`:`<button class="btn" data-act="mclose">Đóng</button>${(empEdit||mgrEdit)?`<button class="btn" data-act="k-save" data-m="draft">Lưu nháp</button>`:''}${empEdit?`<button class="btn btn-p" data-act="k-save" data-m="submit">${ic('send',14)}Gửi quản lý duyệt</button>`:''}${mgrEdit&&k.status==='Chờ quản lý duyệt'?`<button class="btn" data-act="k-save" data-m="return">${ic('undo',14)}Trả lại nhân viên</button>`:''}${mgrEdit?`<button class="btn btn-ok" data-act="k-save" data-m="approve">${ic('check',14)}Xác nhận kết quả chính thức</button>`:''}`;
  const h=modal({title:mgrEdit?'Duyệt đánh giá KPI':'Đánh giá KPI',sub:'Kiểm tra dữ liệu hệ thống, tự đánh giá và giá trị được duyệt trước khi xác nhận kết quả chính thức.',size:'lg',dismiss:false,body,foot,focus:false});
  h.kid=id;h.empEdit=empEdit;h.mgrEdit=mgrEdit;h.noEnter=true;
  h.onInput=()=>{const t=kpiCollect(h,k,true);const cc=kpiCompute(t);$('#kscore',h.box).textContent=fnum(cc.score);$('#krank',h.box).textContent=cc.rank};
  h.onsave=async(mode)=>{
    const tpl=kpiCompute(k).rows.filter(r=>r.c.source==='manual');
    const d=readForm(h.box),er={};
    tpl.forEach(r=>{['self_','actual_'].forEach(p=>{const v=d[p+r.c.id];if(v!=null&&(v<0||v>150))er[p+r.c.id]='Giá trị từ 0 đến 150'})});
    if(mode==='return'&&!d.mgrComment)er.mgrComment='Nhập lý do trả lại';
    if(mode==='submit'&&tpl.some(r=>d['self_'+r.c.id]==null))tpl.forEach(r=>{if(d['self_'+r.c.id]==null)er['self_'+r.c.id]='Nhập giá trị tự đánh giá'});
    if(!showErrs(h.box,er))return;
    if(mode==='approve'){const miss=tpl.filter(r=>d['actual_'+r.c.id]==null).length;if(miss&&!await confirmBox({title:'Xác nhận kết quả chính thức',msg:`Còn ${miss} chỉ tiêu chưa có giá trị "Thực tế được duyệt". Hệ thống sẽ dùng giá trị tự đánh giá hoặc mặc định đạt mục tiêu. Tiếp tục?`,ok:'Xác nhận'}))return}
    kpiCollect(h,k,false);
    if(mode==='submit'){k.status='Chờ quản lý duyệt';k.submittedAt=Date.now()}
    if(mode==='return'){k.status='Đang theo dõi'}
    if(mode==='approve'){k.status='Đã duyệt';k.approvedAt=Date.now();k.approvedBy=S.meta.me}
    logAct(`KPI ${k.id} (${eName(k.empId)}): ${{draft:'lưu nháp',submit:'gửi duyệt',return:'trả lại',approve:'xác nhận kết quả'}[mode]}`);
    save();h.close();render();toast({draft:'Đã lưu nháp',submit:'Đã gửi quản lý duyệt',return:'Đã trả lại nhân viên',approve:'Đã xác nhận kết quả chính thức'}[mode]);
  };
}
function kpiCollect(h,k,temp){
  const d=readForm(h.box);const t=temp?{...k,items:JSON.parse(JSON.stringify(k.items||{}))}:k;t.items=t.items||{};
  kpiCompute({...k,snap:null}).rows.filter(r=>r.c.source==='manual').forEach(r=>{const id=r.c.id,it=t.items[id]=t.items[id]||{};
    if(h.empEdit){it.self=d['self_'+id]==null?null:d['self_'+id];it.selfNote=d['selfNote_'+id]||''}
    if(h.mgrEdit){it.actual=d['actual_'+id]==null?null:d['actual_'+id];it.mgrNote=d['mgrNote_'+id]||''}});
  if(h.empEdit)t.empComment=d.empComment||'';if(h.mgrEdit)t.mgrComment=d.mgrComment||'';
  return t;
}

/* ---------- Đánh giá KPI ---------- */
VIEWS.kpirev=()=>{
  const p=kpiPeriod();ensureKpi(p);const f=fget('kpirev');
  const defs=[{k:'status',l:'Trạng thái',opts:KST.map(x=>[x,x])},{k:'dept',l:'Phòng ban',opts:S.cats.depts.map(x=>[x,x])}];
  const l=S.kpis.filter(k=>k.period===p&&canSeeKpi(k.empId)&&(canApproveKpi(k.empId)||k.empId===S.meta.me)).map(k=>({k,e:gEmp(k.empId),c:kpiCompute(k)})).filter(x=>x.e&&fsel(f,'status',x.k.status)&&fsel(f,'dept',x.e.dept)&&fq(f,x.e.name,x.k.id)).sort((a,b)=>(a.k.status==='Chờ quản lý duyệt'?0:1)-(b.k.status==='Chờ quản lý duyệt'?0:1)||(a.e.name<b.e.name?-1:1));
  const pg=paginate('kpirev',l,15);
  return `<h2 class="pg-t">Đánh giá KPI</h2><p class="pg-s">Nhân viên tự đánh giá các chỉ tiêu cần nhập; quản lý kiểm tra, điều chỉnh và xác nhận kết quả chính thức. Kỳ: <b>${fm(p)}</b></p>`+filterBar('kpirev',defs,{ph:'Tìm theo tên nhân sự, mã KPI...'})
  +(l.length?`<div class="tw"><table class="tbl"><thead><tr><th>Thao tác</th><th>Nhân sự</th><th>Kỳ</th><th>Trạng thái</th><th>Phòng ban</th><th>Điểm</th></tr></thead><tbody>${pg.items.map(x=>{const can=x.k.status!=='Đã chốt'&&(canApproveKpi(x.k.empId)||(x.k.empId===S.meta.me&&x.k.status==='Đang theo dõi'));return `<tr><td>${can?`<button class="btn btn-sm btn-p" data-act="k-rev" data-id="${x.k.id}">${ic('clip',13)}${canApproveKpi(x.k.empId)?'Duyệt KPI':'Tự đánh giá'}</button>`:`<button class="btn btn-sm" data-act="k-view" data-id="${x.k.id}">${ic('eye',13)}Xem</button>`}</td><td>${person(x.e.id)}</td><td>${p.slice(5)}/${p.slice(0,4)}</td><td>${kstTag(x.k.status)}</td><td>${esc(x.e.dept)}</td><td><b>${fnum(x.c.score)}</b> <small class="mut">/${S.settings.cap}</small></td></tr>`}).join('')}</tbody></table></div>`+pg.html:`<div class="card">${emptyState('Không có hồ sơ cần đánh giá','Bạn chỉ thấy hồ sơ của mình và của nhân sự thuộc quyền quản lý.')}</div>`);
};

/* ---------- Chốt KPI ---------- */
function lockKpi(k){k.snap=kpiCompute({...k,snap:null});k.status='Đã chốt';k.lockedAt=Date.now();k.lockedBy=S.meta.me}
VIEWS.kpiclose=()=>{
  const p=kpiPeriod();ensureKpi(p);
  const l=S.kpis.filter(k=>k.period===p&&canSeeKpi(k.empId)).map(k=>({k,e:gEmp(k.empId),c:kpiCompute(k)})).filter(x=>x.e).sort((a,b)=>KST.indexOf(a.k.status)-KST.indexOf(b.k.status));
  const n=s=>l.filter(x=>x.k.status===s).length;
  return `<div class="card-h" style="align-items:flex-start"><div><h2 class="pg-t">Chốt KPI</h2><p class="pg-s" style="margin:0">Khóa kết quả chính thức của kỳ <b>${fm(p)}</b>. Sau khi chốt, dữ liệu hệ thống được lưu cố định và không thể chỉnh sửa.</p></div><div class="acts">${isMgr()?`<button class="btn btn-p" data-act="kc-all" ${n('Đã duyệt')?'':'disabled'}>${ic('lock',15)}Chốt tất cả đã duyệt (${n('Đã duyệt')})</button>`:''}${isAdmin()?`<button class="btn" data-act="kc-force">Duyệt & chốt toàn bộ</button>`:''}<button class="btn" data-act="export" data-v="kpi">${ic('dl',15)}Xuất CSV</button></div></div>
  <div class="stats" style="margin-top:14px">${statBox('users','c-blue','Tổng hồ sơ',l.length)}${statBox('clock','c-orange','Chưa sẵn sàng',n('Đang theo dõi')+n('Chờ quản lý duyệt'),'Đang theo dõi / chờ duyệt')}${statBox('check','c-violet','Đã duyệt',n('Đã duyệt'),'Sẵn sàng chốt')}${statBox('lock','c-green','Đã chốt',n('Đã chốt'))}</div>
  ${l.length?`<div class="tw"><table class="tbl"><thead><tr><th>Nhân sự</th><th>Phòng ban</th><th>Trạng thái</th><th>Điểm</th><th>Xếp loại</th><th>Chốt lúc</th><th>Thao tác</th></tr></thead><tbody>${l.map(x=>`<tr><td>${person(x.e.id)}</td><td>${esc(x.e.dept)}</td><td>${kstTag(x.k.status)}</td><td><b>${fnum(x.c.score)}</b> <small class="mut">/${S.settings.cap}</small></td><td>${isFinal(x.k)?rankTag(x.c.rank):'<span class="mut">—</span>'}</td><td>${x.k.lockedAt?fdt(x.k.lockedAt):'—'}</td><td><span class="acts">${tbtn('k-view','eye','Xem hồ sơ',x.k.id)}${isMgr()&&x.k.status==='Đã duyệt'?`<button class="btn btn-sm" data-act="kc-one" data-id="${x.k.id}">${ic('lock',13)}Chốt</button>`:''}${isAdmin()&&x.k.status==='Đã chốt'?`<button class="btn btn-sm" data-act="kc-open" data-id="${x.k.id}">${ic('unlock',13)}Mở lại</button>`:''}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="card">${emptyState('Chưa có hồ sơ KPI trong kỳ này')}</div>`}`;
};
async function kpiCloseAct(kind,id){
  const p=kpiPeriod();
  if(kind==='one'){const k=S.kpis.find(x=>x.id===id);if(!k)return;if(!await confirmBox({title:'Chốt KPI',msg:`Chốt KPI của ${eName(k.empId)}? Sau khi chốt không thể chỉnh sửa.`,ok:'Chốt KPI'}))return;lockKpi(k);logAct('Chốt KPI '+k.id)}
  if(kind==='all'){const ks=S.kpis.filter(k=>k.period===p&&k.status==='Đã duyệt'&&canSeeKpi(k.empId));if(!await confirmBox({title:'Chốt KPI kỳ '+fm(p),msg:`Chốt ${ks.length} hồ sơ đã duyệt? Các hồ sơ chưa duyệt sẽ được giữ nguyên.`,ok:'Chốt '+ks.length+' hồ sơ'}))return;ks.forEach(lockKpi);logAct(`Chốt ${ks.length} hồ sơ KPI ${p}`)}
  if(kind==='force'){const ks=S.kpis.filter(k=>k.period===p&&k.status!=='Đã chốt');if(!await confirmBox({title:'Duyệt & chốt toàn bộ',msg:`${ks.length} hồ sơ chưa chốt sẽ được duyệt và chốt ngay, kể cả hồ sơ chưa có đánh giá (chỉ tiêu tự nhập mặc định đạt mục tiêu). Chỉ dùng khi cần đóng kỳ. Tiếp tục?`,ok:'Duyệt & chốt',danger:true}))return;ks.forEach(k=>{k.approvedAt=Date.now();k.approvedBy=S.meta.me;lockKpi(k)});logAct(`Duyệt & chốt toàn bộ KPI ${p}`)}
  if(kind==='open'){const k=S.kpis.find(x=>x.id===id);if(!k)return;if(!await confirmBox({title:'Mở lại hồ sơ KPI',msg:`Mở lại hồ sơ ${k.id} của ${eName(k.empId)}? Hồ sơ trở về trạng thái "Đã duyệt".`,ok:'Mở lại'}))return;k.snap=null;k.status='Đã duyệt';k.lockedAt=null;logAct('Mở lại KPI '+k.id)}
  save();render();toast('Đã cập nhật KPI');
}

/* ---------- Mẫu KPI ---------- */
VIEWS.kpitpl=()=>{
  const card=t=>{const w=sum(t.criteria.map(c=>c.weight));
    return `<div class="card" style="margin-bottom:16px"><div class="card-h"><div><h3>${esc(t.name)} ${t.isDefault?'<span class="tag t-pri">Mặc định</span>':''}</h3><small>${t.id} · Áp dụng: ${t.isDefault&&!t.positions.length&&!t.depts.length?'Tất cả nhân sự chưa thuộc mẫu riêng':[...t.positions.map(x=>'Chức vụ '+x),...t.depts.map(x=>'Phòng '+x)].join(', ')||'Chưa chọn đối tượng'}</small></div><span class="acts">${isMgr()?`${!t.isDefault?`<button class="btn btn-sm" data-act="tp-def" data-id="${t.id}">Đặt mặc định</button>`:''}${tbtn('tp-copy','copy','Nhân bản',t.id)}${tbtn('tp-edit','edit','Sửa',t.id)}${!t.isDefault?tbtn('tp-del','trash','Xóa',t.id,'d'):''}`:''}</span></div>
    <div class="tw"><table class="tbl" style="min-width:620px"><thead><tr><th>Chỉ tiêu</th><th>Nguồn dữ liệu</th><th>Hướng</th><th>Mục tiêu</th><th>Trọng số</th></tr></thead><tbody>${t.criteria.map(c=>`<tr><td><span class="t1" style="font-weight:500">${esc(c.name)}</span><small>${esc(c.desc||'')}</small></td><td>${esc(srcLabel[c.source])}</td><td>${c.dir==='down'?'Càng thấp càng tốt':'Càng cao càng tốt'}</td><td>${c.target} ${unitTxt(c.unit)}</td><td><b>${c.weight}%</b></td></tr>`).join('')}</tbody></table></div><div class="sp" style="margin-top:8px"><span>${t.criteria.length} chỉ tiêu</span><b style="color:${w===100?'var(--ok)':'var(--bad)'}">Tổng trọng số: ${w}%${w===100?'':' (nên bằng 100%)'}</b></div></div>`};
  return `<div class="card-h" style="align-items:flex-start"><div><h2 class="pg-t">Mẫu KPI</h2><p class="pg-s" style="margin:0">Bộ chỉ tiêu, mục tiêu và trọng số áp dụng cho nhân sự theo chức vụ hoặc phòng ban</p></div>${isMgr()?`<button class="btn btn-p" data-act="tp-new">${ic('plus',16)}Thêm mẫu KPI</button>`:''}</div><div style="margin-top:14px">${S.tpls.map(card).join('')||emptyState('Chưa có mẫu KPI')}</div>`;

function critRow(c){
  return `<div class="crit cr" style="padding:10px"><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end"><label class="hint" style="grid-column:span 4">Tên chỉ tiêu<input class="inp cr-n" value="${esc(c.name)}"></label><button class="icon-btn d" style="justify-self:end;grid-column:span 2" data-act="cr-del" title="Xóa chỉ tiêu" aria-label="Xóa chỉ tiêu">${ic('trash',15)}</button>
  <label class="hint" style="grid-column:span 3">Nguồn dữ liệu<select class="inp cr-s">${Object.entries(srcLabel).map(([k,l])=>`<option value="${k}" ${c.source===k?'selected':''}>${l}</option>`).join('')}</select></label><label class="hint" style="grid-column:span 3">Hướng<select class="inp cr-d"><option value="up" ${c.dir!=='down'?'selected':''}>Càng cao càng tốt</option><option value="down" ${c.dir==='down'?'selected':''}>Càng thấp càng tốt</option></select></label>

}
function openTplForm(id,copy){
  const src=id?S.tpls.find(t=>t.id===id):null;
  const t=src?{...src,criteria:src.criteria.map(c=>({...c}))}:{name:'',positions:[],depts:[],criteria:[{id:'c'+Date.now(),name:'',desc:'',source:'manual',dir:'up',unit:'Điểm',target:100,weight:100}]};
  if(copy){t.name=t.name+' (bản sao)';t.positions=[];t.depts=[]}
  const edit=src&&!copy;
  const h=modal({title:edit?'Sửa mẫu KPI':copy?'Nhân bản mẫu KPI':'Thêm mẫu KPI',sub:edit?src.id:'',size:'lg',dismiss:false,body:`<div class="frm">${fld({n:'name',l:'Tên mẫu',v:t.name,req:1,full:1})}${fld({n:'positions',l:'Áp dụng cho chức vụ',t:'multi',v:t.positions,opts:S.cats.positions})}${fld({n:'depts',l:'Áp dụng cho phòng ban',t:'multi',v:t.depts,opts:S.cats.depts})}</div><div class="hr"></div><div class="card-h"><h4>Chỉ tiêu</h4><span class="tag" id="wsum"></span></div><div id="crits">${t.criteria.map(critRow).join('')}</div><button class="btn btn-sm btn-soft" data-act="cr-add">${ic('plus',14)}Thêm chỉ tiêu</button><div class="err" id="cerr" style="margin-top:8px"></div>`,foot:`<button class="btn" data-act="mclose">Hủy</button><button class="btn btn-p" data-act="save">Lưu mẫu KPI</button>`});
  const wsum=()=>{const w=sum($$('.cr-w',h.box).map(i=>+i.value||0));const e=$('#wsum',h.box);e.textContent='Tổng trọng số: '+r1(w)+'%';e.className='tag '+(Math.abs(w-100)<.01?'t-ok':'t-warn')};
  h.onInput=wsum;wsum();h.noEnter=true;
  h.onsave=()=>{
    const d=readForm(h.box),er={};if(!d.name)er.name='Nhập tên mẫu';
    const cs=$$('.cr',h.box).map((r,i)=>{const src=$('.cr-s',r).value;return {id:$('.cr-id',r).value||'c'+Date.now()+i,name:$('.cr-n',r).value.trim(),desc:($('.cr-desc',r).value||'')||(srcLabel[src].replace('Tự động · ','')+' · '+($('.cr-d',r).value==='down'?'Càng thấp càng tốt':'Càng cao càng tốt')),source:src,dir:$('.cr-d',r).value,unit:$('.cr-u',r).value,target:+$('.cr-t',r).value,weight:+$('.cr-w',r).value}});
    let ce='';if(!cs.length)ce='Cần ít nhất 1 chỉ tiêu';else if(cs.some(c=>!c.name))ce='Mỗi chỉ tiêu cần có tên';else if(cs.some(c=>!(c.target>0)))ce='Mục tiêu phải lớn hơn 0';else if(cs.some(c=>c.weight<0||isNaN(c.weight)))ce='Trọng số không hợp lệ';else if(Math.abs(sum(cs.map(c=>c.weight))-100)>.01)ce='Tổng trọng số phải bằng 100% (hiện tại '+r1(sum(cs.map(c=>c.weight)))+'%)';
    const fok=showErrs(h.box,er);$('#cerr',h.box).textContent=ce;if(!fok||ce){if(ce)$('#cerr',h.box).scrollIntoView({block:'center'});return}
    cs.forEach((c,i)=>{if(cs.findIndex(x=>x.id===c.id)!==i)c.id='c'+Date.now()+i});
    if(edit){Object.assign(src,{name:d.name,positions:d.positions||[],depts:d.depts||[],criteria:cs});logAct('Sửa mẫu KPI '+src.id)}
    else{S.tpls.push({id:nextCode('MK',S.tpls),name:d.name,isDefault:false,positions:d.positions||[],depts:d.depts||[],criteria:cs});logAct('Tạo mẫu KPI '+d.name)}
    save();h.close();render();toast('Đã lưu mẫu KPI');
  };
}

async function delEmp(id){
  const e=gEmp(id);if(!e)return;

  if(used)return toast(`${e.name} đang liên quan tới ${used} công việc/dự án/nhân sự khác. Hãy chuyển trạng thái sang "Nghỉ việc" thay vì xóa.`,'err');
  if(!await confirmBox({title:'Xóa nhân sự',msg:`Xóa hồ sơ ${e.name}? Dữ liệu KPI của nhân sự này cũng bị xóa.`,ok:'Xóa',danger:true}))return;

}

const CATS=[['depts','Phòng ban'],['positions','Chức vụ'],['ptypes','Loại dự án'],['groups','Nhóm công việc']];
function catUsage(key,name){
  if(key==='depts')return S.emps.filter(e=>e.dept===name).length+S.tpls.filter(t=>t.depts.includes(name)).length;
  if(key==='positions')return S.emps.filter(e=>e.position===name).length+S.tpls.filter(t=>t.positions.includes(name)).length;
  if(key==='ptypes')return S.projects.filter(p=>p.type===name).length;
  return S.tasks.filter(t=>t.group===name).length;
}
VIEWS.cats=()=>{
  if(UI.tab.cat==='subtpl')return subtplView();
  const tab=UI.tab.cat||'depts',list=S.cats[tab];

};
function promptBox(o){
  return new Promise(res=>{const h=modal({title:o.title,size:'sm',dismiss:false,body:`<div class="frm" style="grid-template-columns:1fr">${fld({n:'v',l:o.label,v:o.value||'',req:1})}</div>`,foot:`<button class="btn" data-act="mclose">Hủy</button><button class="btn btn-p" data-act="save">Lưu</button>`});
    h.onsave=()=>{const d=readForm(h.box);if(!showErrs(h.box,d.v?{}:{v:'Không được để trống'}))return;res(d.v);h.onclose=null;h.close()};h.onclose=()=>res(null)});
}
async function catAct(kind,idx){
  const tab=UI.tab.cat||'depts',list=S.cats[tab];
  if(kind==='add'){const el=$('#catNew'),v=(el.value||'').trim();if(!v)return el.focus();if(list.some(x=>norm(x)===norm(v)))return toast('Mục này đã tồn tại','err');list.push(v);logAct('Thêm danh mục '+v)}
  if(kind==='edit'){const old=list[idx];const v=await promptBox({title:'Đổi tên',label:'Tên mới',value:old});if(!v||v===old)return;if(list.some((x,i)=>i!==idx&&norm(x)===norm(v)))return toast('Tên đã tồn tại','err');
    list[idx]=v;if(tab==='depts'){S.emps.forEach(e=>{if(e.dept===old)e.dept=v});S.tpls.forEach(t=>t.depts=t.depts.map(x=>x===old?v:x))}
    if(tab==='positions'){S.emps.forEach(e=>{if(e.position===old)e.position=v});S.tpls.forEach(t=>t.positions=t.positions.map(x=>x===old?v:x))}
    if(tab==='ptypes')S.projects.forEach(p=>{if(p.type===old)p.type=v});if(tab==='groups')S.tasks.forEach(t=>{if(t.group===old)t.group=v});logAct(`Đổi tên danh mục ${old} → ${v}`)}
  if(kind==='del'){const n=list[idx];if(catUsage(tab,n))return toast(`"${n}" đang được sử dụng (${catUsage(tab,n)}), không thể xóa. Hãy đổi tên hoặc chuyển dữ liệu trước.`,'err');if(!await confirmBox({title:'Xóa mục',msg:`Xóa "${n}" khỏi danh mục?`,ok:'Xóa',danger:true}))return;list.splice(idx,1);logAct('Xóa danh mục '+n)}
  save();render();
}

function addDoc(file,link){
  return new Promise(res=>{
    const rec={id:nextCode('TL',S.docs),name:file.name,size:file.size,type:file.type||'',projectId:link.projectId||'',taskId:link.taskId||'',by:S.meta.me,date:today(),url:'',data:''};
    const fin=()=>{S.docs.push(rec);logAct('Đính kèm tài liệu '+rec.name);save();render();refreshTaskModals();toast('Đã thêm tài liệu');res(rec)};
    if(file.size<=300*1024&&!netOn()){const r=new FileReader();r.onload=()=>{rec.data=r.result;fin()};r.onerror=()=>fin();r.readAsDataURL(file)}else fin();
  });

/* ---------- Google Calendar ---------- */
function gcalLink(t){
  const f=(d,tm)=>d.replace(/-/g,'')+(tm?'T'+tm.replace(':','')+'00':'');
  let dates;
  if(t.startTime||t.dueTime){const st=t.startTime||'09:00',et=t.dueTime||'17:00',sd=t.start||t.due;dates=f(sd,st)+'/'+f(t.due,(t.due===sd&&et<=st)?addHr(st):et)}
  else dates=f(t.start||t.due)+'/'+f(addDays(t.due,1));
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(`${t.id} · ${t.name}`)+'&dates='+dates+'&details='+encodeURIComponent(`Dự án: ${pName(t.projectId)}\nNgười thực hiện: ${eName(t.assigneeId)}\nTrạng thái: ${t.status}\n${t.desc||''}`);
}
const addHr=tm=>{const [h,m]=tm.split(':').map(Number);return pad(Math.min(23,h+1))+':'+pad(m)};

function digestFor(e){
  const td=today(),ts=S.tasks.filter(t=>isOpen(t)&&!t.archived&&(t.assigneeId===e.id||t.memberIds.includes(e.id)));
  const od=ts.filter(isOverdue),today_=ts.filter(t=>!isOverdue(t)&&t.due===td),soon=ts.filter(t=>!isOverdue(t)&&t.due>td&&diff(t.due,td)<=warnDays());
  const line=t=>`- ${t.id} ${t.name} (hạn ${fd(t.due)}${t.dueTime?' '+t.dueTime:''}${isOverdue(t)?', quá '+Math.max(1,-daysLeft(t))+' ngày':''})`;
  if(!od.length&&!today_.length&&!soon.length)return null;
  const sec=(t,a)=>a.length?`\n${t} (${a.length}):\n${a.sort((x,y)=>x.due<y.due?-1:1).map(line).join('\n')}\n`:'';
  return {e,counts:[od.length,today_.length,soon.length],text:`Chào ${e.name},\n\nBản tin công việc ngày ${fd(td)}:\n${sec('QUÁ HẠN',od)}${sec('HẾT HẠN HÔM NAY',today_)}${sec(`SẮP ĐẾN HẠN (${warnDays()} ngày tới)`,soon)}\nVui lòng cập nhật tiến độ trên hệ thống. Cảm ơn bạn!`};
}
UI.dgTab='daily';
function weeklyFor(e){
  const td=today(),a=addDays(td,-6),mine=S.tasks.filter(t=>t.assigneeId===e.id&&t.status!=='Đã huỷ');
  const done=mine.filter(t=>t.status==='Hoàn thành'&&t.completedAt>=a&&t.completedAt<=td),on=done.filter(t=>timeliness(t)!=='Trễ hạn').length;
  const next=mine.filter(t=>isOpen(t)&&t.due>=td&&diff(t.due,td)<=7).sort((x,y)=>x.due<y.due?-1:1),od=mine.filter(isOverdue);
  if(!done.length&&!next.length&&!od.length)return null;
  const by={};done.forEach(t=>{const k=t.projectId?pName(t.projectId):(t.group||'Khác');by[k]=(by[k]||0)+1});
  const lines=(arr,f)=>arr.length?arr.map(f).join('\n'):'- (chưa có)';
  return {e,counts:[done.length,done.length?Math.round(on/done.length*100):null,od.length],weekly:true,text:`Chào ${e.name},\n\nBÁO CÁO TUẦN ${fd(a)} - ${fd(td)}\n- Việc đã xong: ${done.length}\n- Tỷ lệ đúng hạn: ${done.length?Math.round(on/done.length*100)+'%':'—'}\n- Đang quá hạn: ${od.length}\n\nPHÂN LOẠI:\n${lines(Object.keys(by),k=>'- '+k+': '+by[k]+' việc')}\n\nĐÃ HOÀN THÀNH (${done.length}):\n${lines(done,t=>'- '+t.id+' '+t.name)}\n\nTUẦN TỚI (${next.length}):\n${lines(next,t=>'- '+t.id+' '+t.name+' (hạn '+fd(t.due)+')')}\n\nCảm ơn bạn!`};
}
function paintDigest(h){
  const wk=UI.dgTab==='weekly',es=visibleEmps().filter(e=>e.status==='Đang làm');
  const ds=es.map(wk?weeklyFor:digestFor).filter(Boolean);h.digests=ds;
  const tabs=`<div class="utabs"><button class="utab ${wk?'':'on'}" data-act="dg-tab" data-v="daily">Nhắc việc hôm nay</button><button class="utab ${wk?'on':''}" data-act="dg-tab" data-v="weekly">Báo cáo tuần</button></div>`;
  const sub=wk?'Báo cáo 7 ngày gần nhất cho từng người: việc đã xong, tỷ lệ đúng hạn, phân loại và kế hoạch tuần tới.':'Tổng hợp việc quá hạn, hết hạn hôm nay và sắp đến hạn cho từng người.';
  h.set({title:'Bản tin nhắc việc',sub:sub+' Sao chép nội dung hoặc mở thư nháp trong ứng dụng email của bạn.',
   body:`<div class="note w" style="margin-bottom:12px">${ic('warn',15)}<span>Bản chạy trên trình duyệt <b>không tự gửi email</b>. Bạn bấm "Mở email" để gửi thư nháp, hoặc sao chép dán vào Zalo / Teams. (Bản nhiều người dùng có máy chủ có thể tự gửi hằng ngày, xem hướng dẫn.)</span></div>${tabs}${ds.length?ds.map((d,i)=>`<div class="card" style="margin-bottom:12px;padding:14px"><div class="card-h" style="margin-bottom:8px"><div class="pp">${av(d.e.id)}<span><b>${esc(d.e.name)}</b><small style="display:block;color:var(--muted)">${d.weekly?`Xong ${d.counts[0]} · Đúng hạn ${d.counts[1]==null?'—':d.counts[1]+'%'} · Quá hạn ${d.counts[2]}`:`Quá hạn ${d.counts[0]} · Hôm nay ${d.counts[1]} · Sắp đến hạn ${d.counts[2]}`}</small></span></div><span class="acts"><button class="btn btn-sm" data-act="dg-copy" data-i="${i}">${ic('copy',13)}Sao chép</button>${d.e.email?`<a class="btn btn-sm btn-p" href="mailto:${esc(d.e.email)}?subject=${encodeURIComponent((wk?'Báo cáo tuần ':'Bản tin công việc ')+fd(today()))}&body=${encodeURIComponent(d.text)}">${ic('send',13)}Mở email</a>`:''}</span></div><textarea class="dgbox" id="dgta_${i}" readonly aria-label="Nội dung bản tin ${esc(d.e.name)}">${esc(d.text)}</textarea></div>`).join(''):emptyState('Không có nội dung cần gửi',wk?'Chưa có việc hoàn thành hoặc kế hoạch tuần tới.':'Mọi người đều đang đúng tiến độ.')}`,
   foot:`<button class="btn btn-p" data-act="mclose">Đóng</button>`});
}
function openDigest(){const h=modal({title:'Bản tin nhắc việc',size:'lg',body:'',focus:false});paintDigest(h)}
async function copyDigest(el){
  const b=el.closest('.mback'),h=b._h,i=+el.dataset.i,ta=$('#dgta_'+i,b),txt=h.digests[i].text;

VIEWS.help=()=>`<h2 class="pg-t">Hướng dẫn sử dụng</h2><p class="pg-s">Tóm tắt cách dùng và ý nghĩa các ký hiệu trong ứng dụng</p>
<div class="grid g2e guide"><div class="card"><h4 style="margin-top:0">1. Bắt đầu nhanh</h4><ul><li>Bấm <b>Thêm nhanh</b> hoặc <b>Thêm công việc</b>: nhập tên, người thực hiện, ngày giờ bắt đầu và hạn.</li><li>Chọn <b>Kỳ đang xem</b> ở góc trên để lọc Dashboard và KPI theo tháng.</li><li>Dùng ô <b>đổi người dùng</b> cuối thanh menu để thử vai trò Admin, Quản lý, Nhân viên.</li><li>Dữ liệu lưu trong trình duyệt này: hãy sao lưu JSON ở <b>Cài đặt</b>.</li></ul>
<h4>2. Trạng thái công việc</h4><ul><li><b>Chưa bắt đầu</b> → <b>Đang thực hiện</b> → <b>Chờ xác nhận</b> → <b>Hoàn thành</b>.</li><li><b>Đang chờ</b>: việc tạm dừng vì chờ người khác hoặc điều kiện bên ngoài.</li><li><b>Đã huỷ</b>: việc không còn thực hiện; không tính vào thống kê và KPI.</li><li>Nhân viên bấm hoàn thành sẽ chuyển sang Chờ xác nhận; quản lý xác nhận hoặc trả lại.</li></ul>
<h4>3. Màu sắc và ký hiệu</h4><ul><li>Nền <b>đỏ nhạt</b>: quá hạn · nền <b>xanh nhạt</b>: hạn hôm nay · chữ <b>gạch ngang</b>: đã xong / đã huỷ.</li><li><b>Còn lại (ngày)</b>: số âm là đã quá hạn.</li><li>Việc đã xong được gắn <b>Sớm hạn</b>, <b>Đúng hạn</b> hoặc <b>Trễ hạn</b> tự động theo ngày hoàn thành.</li><li><b>↻</b>: việc tự tạo từ Task lặp lại; chip nét đứt trên lịch là lần <b>Dự kiến</b>.</li></ul></div>
<div class="card"><h4 style="margin-top:0">4. Task lặp lại</h4><ul><li>Vào <b>Task lặp lại</b> → Thêm lịch lặp: chọn thứ trong tuần (T2-CN) hoặc ngày trong tháng.</li><li>Đến ngày, ứng dụng tự tạo công việc cho người thực hiện khi bạn mở app (tối đa bù 7 ngày vắng mặt).</li><li>Tắt công tắc <b>Bật</b> để tạm dừng; xóa lịch không xóa việc đã tạo.</li></ul>
<h4>5. Lưu trữ và dọn dẹp</h4><ul><li>Quản lý bấm <b>Lưu trữ việc đã xong</b> để chuyển việc hoàn thành sang tab Lưu trữ. Việc lưu trữ vẫn tính trong báo cáo và KPI.</li><li>Tab <b>Hôm nay</b> liệt kê việc đang trong thời gian thực hiện.</li></ul>
<h4>6. Nhắc việc và lịch</h4><ul><li><b>Bản tin nhắc việc</b> (trang Việc cần xử lý) tạo nội dung nhắc cho từng người để gửi email hoặc dán vào chat.</li><li>Trong hồ sơ công việc, nút <b>Google Calendar</b> mở sẵn sự kiện để bạn thêm vào lịch cá nhân.</li><li>Số ngày cảnh báo "Sắp đến hạn" chỉnh ở <b>Cài đặt</b>.</li></ul>
<h4>7. KPI</h4><ul><li>2 chỉ tiêu tự động: tỷ lệ hoàn thành và tỷ lệ đúng hạn của việc có hạn trong tháng. Các chỉ tiêu còn lại nhân viên tự đánh giá, quản lý duyệt.</li><li>Chốt KPI để khóa kết quả chính thức của kỳ.</li></ul></div></div>`;
